name: Windows release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test
        run: |
          python -m unittest discover -s tests -v
          python -m file_integrity_timeline self-test
      - name: Install packager
        run: python -m pip install pyinstaller==6.22.3
      - name: Build desktop and command line programs
        run: |
          python -m PyInstaller --clean --noconfirm --onefile --windowed --name FileIntegrityTimeline launch_gui.py
          python -m PyInstaller --clean --noconfirm --onefile --console --name fit-cli launch_cli.py
      - name: Smoke-test packaged CLI
        run: .\dist\fit-cli.exe self-test
      - name: Package and hash
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-package | Out-Null
          Copy-Item dist\FileIntegrityTimeline.exe,dist\fit-cli.exe,README.md,LICENSE -Destination release-package
          Compress-Archive -Path release-package\* -DestinationPath FileIntegrityTimeline-windows-x64.zip
          $hash = (Get-FileHash FileIntegrityTimeline-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  FileIntegrityTimeline-windows-x64.zip" | Set-Content -Encoding ascii FileIntegrityTimeline-windows-x64.zip.sha256
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create '${{ github.ref_name }}' FileIntegrityTimeline-windows-x64.zip FileIntegrityTimeline-windows-x64.zip.sha256 --verify-tag --generate-notes --title '${{ github.ref_name }}'
